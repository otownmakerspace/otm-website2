<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Instagram / Facebook story (1080x1920) — 9:16
  Safe zone: keep important content between y=250 and y=1670 (Instagram UI overlays the rest)
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="storyOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1A63" stop-opacity="0.50"/>
      <stop offset="0.6" stop-color="#0D1A63" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0D1A63" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Photo full bleed -->
  <image xlink:href="../../assets/images/socials/16_ida_laser.jpg"
         x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1080" height="1920" fill="url(#storyOverlay)"/>

  <!-- Top: small brand bar (above safe zone, but readable on most devices) -->
  <g transform="translate(60, 280)">
    <!-- Gear mark (gear-mark-white.svg colorway, knockout on photo) -->
    <g transform="translate(0, 14) scale(0.21)">
      <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
        <polygon points="-32,-345 32,-345 40,-290 -40,-290"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(30)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(60)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(90)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(120)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(150)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(180)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(210)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(240)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(270)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(300)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(330)"/>
      </g>
      <circle r="290" fill="#FFFFFF"/>
      <circle r="220" fill="#0D1A63"/>
      <circle r="220" fill="none" stroke="#FFFFFF" stroke-width="12"/>
      <text x="0" y="-10" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="270"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
            text-anchor="middle" letter-spacing="-4">T</text>
      <text x="0" y="185" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="230"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
            text-anchor="middle" letter-spacing="-4">M</text>
    </g>
    <text x="100" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="34"
          fill="#FFFFFF">O'Town Makerspace</text>
  </g>

  <!-- Big headline -->
  <text x="60" y="1100" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="130" fill="#FFFFFF" letter-spacing="-4">Curious?</text>
  <text x="60" y="1240" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="130" fill="#F68048" letter-spacing="-4">Drop in.</text>

  <!-- Body -->
  <text x="60" y="1360" font-family="Inter, sans-serif" font-weight="500"
        font-size="44" fill="#EDF2F8">Open Tuesdays + Thursdays · 18:00–21:00</text>
  <text x="60" y="1420" font-family="Inter, sans-serif" font-weight="500"
        font-size="44" fill="#EDF2F8">Free tour · No booking · Bring a friend</text>

  <!-- Big CTA pill -->
  <rect x="60" y="1500" width="960" height="120" rx="60" fill="#F68048"/>
  <text x="540" y="1577" font-family="Inter, sans-serif" font-weight="700"
        font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SWIPE UP TO LEARN MORE</text>

  <!-- Bottom helper text (above story UI safe zone) -->
  <text x="540" y="1670" font-family="Inter, sans-serif" font-weight="500"
        font-size="32" fill="#EDF2F8" text-anchor="middle" opacity="0.85">Havnegade 57 · 5000 Odense C</text>
</svg>
