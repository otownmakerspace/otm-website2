<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Instagram square feed post (1080x1080)
  Use case: facilities highlight — "what's in our space"
  Layout: 2x3 icon grid with category names on a cream background
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect x="0" y="0" width="1080" height="1080" fill="#EDF2F8"/>

  <!-- Header strip -->
  <rect x="0" y="0" width="1080" height="200" fill="#0D1A63"/>
  <text x="60" y="115" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="64" fill="#FFFFFF" letter-spacing="-2">All the tools.</text>
  <text x="60" y="175" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="64" fill="#F68048" letter-spacing="-2">Bring the project.</text>

  <!-- 2x3 icon grid -->
  <g font-family="Inter, sans-serif" font-weight="700" font-size="32" fill="#0D1A63" text-anchor="middle">
    <!-- Row 1 -->
    <g transform="translate(180, 380)">
      <circle r="100" fill="#FFFFFF" stroke="#1A2CA3" stroke-width="3"/>
      <image xlink:href="../../assets/images/icons/3d-print.svg" x="-70" y="-70" width="140" height="140"/>
      <text y="170">3D Printing</text>
    </g>
    <g transform="translate(540, 380)">
      <circle r="100" fill="#FFFFFF" stroke="#1A2CA3" stroke-width="3"/>
      <image xlink:href="../../assets/images/icons/lasercutter.svg" x="-70" y="-70" width="140" height="140"/>
      <text y="170">Laser Cutting</text>
    </g>
    <g transform="translate(900, 380)">
      <circle r="100" fill="#FFFFFF" stroke="#1A2CA3" stroke-width="3"/>
      <image xlink:href="../../assets/images/icons/cnc.svg" x="-70" y="-70" width="140" height="140"/>
      <text y="170">CNC</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(180, 720)">
      <circle r="100" fill="#FFFFFF" stroke="#1A2CA3" stroke-width="3"/>
      <image xlink:href="../../assets/images/icons/wood-workshop.svg" x="-70" y="-70" width="140" height="140"/>
      <text y="170">Woodwork</text>
    </g>
    <g transform="translate(540, 720)">
      <circle r="100" fill="#FFFFFF" stroke="#1A2CA3" stroke-width="3"/>
      <image xlink:href="../../assets/images/icons/electronics.svg" x="-70" y="-70" width="140" height="140"/>
      <text y="170">Electronics</text>
    </g>
    <g transform="translate(900, 720)">
      <circle r="100" fill="#FFFFFF" stroke="#1A2CA3" stroke-width="3"/>
      <image xlink:href="../../assets/images/icons/sewing.svg" x="-70" y="-70" width="140" height="140"/>
      <text y="170">Textiles</text>
    </g>
  </g>

  <!-- Footer with brand -->
  <rect x="0" y="980" width="1080" height="100" fill="#F68048"/>
  <text x="540" y="1042" font-family="Inter, sans-serif" font-weight="700"
        font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">@theotowngarage  ·  Odense</text>
</svg>
