<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Avatar — circular profile-picture optimisation.

  Just the gear-mark, full canvas, no padding. The square crop is
  intentional: social platforms apply their own circular mask, and the
  gear's content is centre-safe (the outer teeth at r=345 sit well inside
  a 400-px-radius circle), so the round mask doesn't clip anything.

  Use this file (not gear-mark.svg directly) when you need a profile-pic
  asset — it's named for that intent so anyone hunting for "avatar" finds
  it, and exporting render.sh produces correctly-sized 320 / 360 / 720 /
  1024 / 1200 PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <image href="gear-mark.svg" x="0" y="0" width="800" height="800"/>
</svg>
