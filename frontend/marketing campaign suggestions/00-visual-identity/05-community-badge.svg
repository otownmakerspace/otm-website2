<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Community badge — circular emblem reinforcing the safe-community brand pillar.
  Use for: stickers, t-shirts, induction certificates, "member since" badges,
  printed swag, welcome kits.

  Construction (centred at 400,400 in an 800-square canvas):
    r=380   outer navy disc
    r=350   cream hairline pinstripe (3 px stroke)
    r=300   inner Navy-2 surface
    r=290   dashed orange decorative ring (8/6 dasharray)
    r=300   path "badgeTopArc" used to bend the upper text — bows up
            because in SVG (y-down) a sweep=1 arc from a left endpoint
            to a right endpoint traces the upper half of the circle
    r≈135   gear-mark-transparent.svg sits inside, leaving generous
            clearance from the dashed ring

  Top label:    O'TOWN MAKERSPACE  (curved along badgeTopArc)
  Bottom label: ★ ODENSE · DENMARK ★
  Side notes:   small orange dots at 9- and 3-o'clock for craft-stamp feel
-->

<svg
   viewBox="0 0 800 800"
   width="800"
   height="800"
   version="1.1"
   id="svg6"
   sodipodi:docname="05-community-badge.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview6"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.2656192"
     inkscape:cx="302.22361"
     inkscape:cy="419.95254"
     inkscape:window-width="2560"
     inkscape:window-height="1374"
     inkscape:window-x="2560"
     inkscape:window-y="29"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg6" />
  <defs
     id="defs1">
    <!--
      Top arc bows UP (sweep=1, left→right via the upper half).
      Bottom arc bows DOWN (sweep=0, left→right via the lower half).
      Both sit at r=300 from the badge centre, mirroring each other.

      Both paths run in the same reading direction (left→right) so the
      source strings of the textPaths read naturally. SVG places glyph
      tops perpendicular to path direction on the LEFT side of travel:
      that's UP on screen for both arcs, which means caps point OUTWARD
      from centre on the top arc and INWARD (toward centre) on the bottom
      arc — the standard college-seal convention where every letter is
      right-side-up to a normal viewer.
    -->
    <path
       id="badgeTopArc"
       d="M 100,400 A 300,300 0 0 1 700,400"
       fill="none" />
    <path
       id="badgeBottomArc"
       d="M 100,400 A 300,300 0 0 0 700,400"
       fill="none" />
  </defs>
  <!-- Concentric framing rings -->
  <circle
     cx="400"
     cy="400"
     r="380"
     fill="#0D1A63"
     id="circle1" />
  <circle
     cx="-429.36478"
     cy="-368.30136"
     r="350"
     fill="none"
     stroke="#edf2f8"
     stroke-width="3"
     id="circle2"
     transform="matrix(-0.07632928,-0.99708267,-0.99708267,0.07632928,0,0)" />
  <circle
     cx="400"
     cy="400"
     r="300"
     fill="#1A2CA3"
     id="circle3"
     style="fill:#edf2f8;fill-opacity:1" />
  <circle
     cx="400"
     cy="400"
     r="290"
     fill="none"
     stroke="#F68048"
     stroke-width="2"
     stroke-dasharray="8 6"
     id="circle4" />
  <!-- Curved top label -->
  <text
     font-family="Inter, sans-serif"
     font-weight="700"
     font-size="38px"
     fill="#edf2f8"
     letter-spacing="8"
     text-anchor="middle"
     id="text4"
     transform="translate(-5.5308895,-11.851906)"><textPath
       href="#badgeTopArc"
       startOffset="50%"
       id="textPath4">O'TOWN MAKERSPACE</textPath></text>
  <!--
    Centre gear-mark. The "transparent" variant has no outer cream rect
    (so it composites cleanly onto the navy-2 surface), but its inner cap
    is still cream — that's what gives the orange T and navy M their
    contrast against the otherwise blue badge.
  -->
  <image
     href="gear-mark-transparent.svg"
     x="100"
     y="113.26105"
     width="586.73895"
     height="586.73895"
     id="image4"
     style="fill:#edf2f8;fill-opacity:1" />
  <!-- Curved bottom tagline -->
  <text
     font-family="Inter, sans-serif"
     font-weight="600"
     font-size="30px"
     fill="#f68048"
     letter-spacing="14"
     text-anchor="middle"
     id="text5"
     transform="translate(2.032278,-11.061779)"><textPath
       xlink:href="#circle2"
       startOffset="50%"
       id="textPath1">★ ODENSE · DENMARK ★</textPath></text>
  <!-- Decorative side dots at 9 and 3 o'clock -->
  <circle
     cx="80"
     cy="400"
     r="6"
     fill="#F68048"
     id="circle5" />
  <circle
     cx="720"
     cy="400"
     r="6"
     fill="#F68048"
     id="circle6" />
</svg>
