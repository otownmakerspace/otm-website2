<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Vertical lockup — gear above, wordmark below, tagline at bottom.
  Canvas: 800 × 1000 (4:5) — matches Instagram portrait spec.

  Both gear and wordmark are <image> references to the local mirror in
  this same folder, so canonical updates propagate.

  Layout grid:
    y=40..640      gear (600 square, centred horizontally)
    y=680..872     wordmark (720 wide, 192 tall)
    y=950          tagline baseline
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- Gear mark, top -->
  <image href="gear-mark-transparent.svg" x="100" y="40" width="600" height="600"/>

  <!--
    Wordmark, bottom. 720 × 192 preserves the 1200 × 320 = 3.75 : 1 ratio.
  -->
  <image href="wordmark-consolidated.svg" x="40" y="680" width="720" height="192"/>

  <!-- Tagline -->
  <text x="400" y="950" font-family="Inter, sans-serif" font-weight="500"
        font-size="22" fill="#0D1A63" text-anchor="middle" letter-spacing="6">ODENSE · DENMARK</text>
</svg>
