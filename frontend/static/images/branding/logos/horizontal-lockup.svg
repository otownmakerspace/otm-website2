<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Horizontal lockup — gear (left) + wordmark (right) + tagline.
  Canvas: 1600 × 400 (4:1) — matches Google Ads landscape logo spec.

  Gear and wordmark are loaded via <image> references to the local
  mirror in this same folder. Updates to gear-mark-transparent.svg or
  wordmark-consolidated.svg propagate here automatically.

  Layout grid:
    x=40..400      gear (360 wide, square)
    x=430..1570    wordmark (1140 wide, ratio-preserving 304 tall)
    y=370          tagline baseline
-->

<svg
   viewBox="0 0 1600 400"
   version="1.1"
   id="svg2"
   sodipodi:docname="02-horizontal-lockup.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs2" />
  <sodipodi:namedview
     id="namedview2"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.87833555"
     inkscape:cx="863.56518"
     inkscape:cy="235.10377"
     inkscape:window-width="2560"
     inkscape:window-height="1374"
     inkscape:window-x="2560"
     inkscape:window-y="29"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg2" />
  <!-- Gear mark, left -->
  <image
     href="/images/branding/logos/gear-mark-transparent.svg"
     x="148.29599"
     y="-3.1974423e-14"
     width="400"
     height="400"
     id="image1" />
  <!--
    Wordmark, right. Wordmark SVG natural ratio is 1200 × 320 = 3.75 : 1.
    Sized 1140 × 304 to keep that ratio.
  -->
  <image
     href="/images/branding/logos/wordmark-consolidated.svg"
     x="430"
     y="48"
     width="1140"
     height="304"
     id="image2" />
  <!-- Tagline, centred under the wordmark -->
  <text
     x="1000"
     y="370"
     font-family="Inter, sans-serif"
     font-weight="500"
     font-size="20"
     fill="#0D1A63"
     text-anchor="middle"
     letter-spacing="4"
     id="text2">MAKE · TINKER · SHARE  ·  ODENSE</text>
</svg>
