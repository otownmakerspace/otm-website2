baseURL = 'https://otownmakerspace.dk/'
publishDir = 'docs'
title = "O'Town Makerspace — Community Workshop in Odense"
theme = 'hugo-up-business-main'
defaultContentLanguage = 'en'

[languages]
  [languages.en]
    languageCode = 'en-us'
    label = 'English'
    weight = 1
    [languages.en.params]
      description = "A community-driven makerspace in Odense with 24/7 access to 3D printers, laser cutters, CNC machines, electronics, and woodworking tools."
      copyright = "© 2026 O'Town Makerspace. All rights reserved."

  [languages.da]
    languageCode = 'da'
    label = 'Dansk'
    weight = 2
    [languages.da.params]
      description = "Et fællesskabsdrevet værksted i Odense med 24/7 adgang til 3D-printere, laserskærere, CNC-maskiner, elektronik og træværksted."
      copyright = "© 2026 O'Town Makerspace. Alle rettigheder forbeholdes."

[params]
  siteName = "O'Town Makerspace"
  logo = "images/branding/logos/horizontal-lockup-notagline.svg"
  logoDark = "images/branding/logos/wordmark-white-transparent.svg"
  logoVertical = "images/branding/logos/vertical-lockup.svg"
  location = ["Havnegade 57, 5000 Odense C, Denmark"]
  contact = ["info@theotowngarage.com"]
  calendarIcsUrl = "https://calendar.google.com/calendar/ical/info%40theotowngarage.com/public/basic.ics"
  ogImage = "images/og-default.jpg"
  # Google Ads tag (gtag.js). Consent-gated via the Klaro "googleAds"
  # service in baseof.html. Moved here from the retired otg-website
  # (theotowngarage.com) when its traffic was redirected to otm.
  googleAdsID = "AW-17544583777"
  # Google Analytics 4 (gtag.js). Consent-gated via the Klaro
  # "googleAnalytics" service in baseof.html.
  googleAnalyticsID = "G-2QG0JVPCGE"
  # Member-portal links: relative paths only. Hugo never bakes absolute
  # URLs — cross-host routing (apex → members backend) is handled at
  # runtime by the Go server via BACKEND_PUBLIC_URL env var.
  memberPortalUrl = "/login/"
  memberSignupUrl = "/checkout/"

  [[params.sponsor_items]]
    name = "Coalescent Mobile Robotics"
    logo = "images/partners/Coalescent-Mobile-Robotics.webp"
    url = "https://cm-robotics.com"

  [[params.sponsor_items]]
    name = "Rotoy"
    logo = "images/partners/rotoy.svg"
    url = "https://www.rotoy.dk/da"

  [[params.sponsor_items]]
    name = "Hetzner"
    logo = "images/partners/hetzner.svg"
    url = "https://www.hetzner.com"

  [params.colors]
    accent = "#F68048"
    accent_2 = "#e75008"
    primary = "#EDF2F8"
    primary_2 = "#E1E9F4"
    secondary = "#0D1A63"
    secondary_2 = "#1A2CA3"
    gray_light = "#EEF1FF"
    gray_dark = "#0D1A63"
    tertiary = "#1A2CA3"
    # ── Alt palette: warm navy ──
    # accent = "#FAB95B"
    # accent_2 = "#F89812"
    # primary = "#E8E2DB"
    # primary_2 = "#D3C8BB"
    # secondary = "#1A3263"
    # secondary_2 = "#547792"
    # gray_light = "#E8E2DB"
    # gray_dark = "#1A3263"
    # tertiary = "#547792"
    # ── Alt palette: sage/cream ──
    # accent = "#FF7F11"
    # accent_2 = "#D66400"
    # primary = "#E2E8CE"
    # primary_2 = "#ACBFA4"
    # secondary = "#262626"
    # secondary_2 = "#4D4D4D"
    # gray_light = "#E2E8CE"
    # gray_dark = "#262626"
    # tertiary = "#4D4D4D"
    # ── Alt palette: navy-blue ──
    # accent = "#F68048"
    # accent_2 = "#e75008"
    # primary = "#EDF2F8"
    # primary_2 = "#E1E9F4"
    # secondary = "#0D1A63"
    # secondary_2 = "#1A2CA3"
    # gray_light = "#EEF1FF"
    # gray_dark = "#0D1A63"
    # tertiary = "#1A2CA3"

  [params.social]
    facebook = "https://www.facebook.com/profile.php?id=61590717692379&sk=mentions"
    instagram = "https://www.instagram.com/otownmakerspace/"
    discord = "https://discord.gg/RHVfMu49CG"

# Enable raw HTML in markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

