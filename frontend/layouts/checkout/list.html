{{ define "main" }}
<section class="py-16">
  <div class="container mx-auto max-w-md px-4">
    <h1 class="text-secondary mb-6 text-center font-secondary text-3xl font-bold">{{ .Title }}</h1>
    {{ with .Content }}
      <div class="text-gray-dark mb-8 text-center">{{ . }}</div>
    {{ end }}

    <p id="checkout-error" class="text-red-600 mb-4 text-center hidden"></p>

    <form action="/checkout/" method="POST" class="space-y-4 rounded-[10px] bg-surface p-8 shadow-sm">
      <div>
        <label for="name" class="text-secondary mb-1 block text-sm font-medium">Full name</label>
        <input id="name" type="text" name="name" required autocomplete="name"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
      </div>
      <div>
        <label for="email" class="text-secondary mb-1 block text-sm font-medium">Email</label>
        <input id="email" type="email" name="email" required autocomplete="email"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
      </div>
      <div>
        <label for="phone" class="text-secondary mb-1 block text-sm font-medium">Phone (optional)</label>
        <input id="phone" type="tel" name="phone" autocomplete="tel"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
      </div>
      <div>
        <label for="pass" class="text-secondary mb-1 block text-sm font-medium">Password</label>
        <input id="pass" type="password" name="pass" required minlength="8" maxlength="31"
               autocomplete="new-password"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
        <p class="mt-1 text-xs text-gray-dark">8&ndash;31 characters. You'll use this to sign in later.</p>
      </div>
      <button type="submit"
              class="bg-accent hover:bg-accent-2 w-full rounded-[10px] px-4 py-2 font-medium text-white transition-colors">
        Continue to payment
      </button>
    </form>
  </div>
</section>

<script>
  (function () {
    var reasons = {
      email_exists: "An account with that email already exists. Try signing in.",
      stripe_cancel: "Checkout was cancelled. No charge was made.",
      failed_session: "We couldn't reach Stripe. Please try again.",
      failed_crypt: "We couldn't process your password. Please try again."
    };
    var params = new URLSearchParams(window.location.search);
    var reason = params.get('reason');
    if (reason && reasons[reason]) {
      var el = document.getElementById('checkout-error');
      el.textContent = reasons[reason];
      el.classList.remove('hidden');
    }
  })();
</script>
{{ end }}
