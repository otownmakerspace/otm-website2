{{ define "main" }}
<section class="py-16">
  <div class="container mx-auto max-w-2xl px-4 text-center">
    <h1 class="text-secondary mb-6 font-secondary text-3xl font-bold">{{ .Title }}</h1>
    {{ with .Content }}
      <div class="page-content text-gray-dark">{{ . }}</div>
    {{ end }}
    <div class="mt-8">
      <a href="{{ .Params.cta_href | default "/" }}" class="bg-accent hover:bg-accent-2 inline-block rounded-[10px] px-6 py-3 font-medium text-white transition-colors">
        {{ .Params.cta_label | default "Back to homepage" }}
      </a>
    </div>
  </div>
</section>
{{ end }}
