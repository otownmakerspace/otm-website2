{{/* Settings gear — Desktop (click to open; controller lives in shared/header.html) */}}
<div class="hidden xl:block relative" data-dd>
  <button type="button" data-dd-toggle aria-haspopup="true" aria-expanded="false" class="text-secondary hover:text-accent cursor-pointer transition-colors duration-200" aria-label="{{ i18n "settings" }}">
    <i class="fa-solid fa-gear text-xl"></i>
  </button>
  <div data-dd-panel class="invisible opacity-0 transition-all duration-200 absolute right-0 top-full pt-2 z-50">
    <div class="bg-surface rounded-[10px] border border-gray-200 shadow-lg py-3 w-56">
      {{/* Dark Mode */}}
      <div class="px-4 py-3">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-semibold text-secondary-2 uppercase">{{ i18n "dark_mode" }}</span>
          <div class="relative">
            <input type="checkbox" id="darkToggleDesktop" class="sr-only peer" onchange="toggleDarkMode(this.checked)">
            <div class="w-9 h-5 bg-gray-300 rounded-full peer-checked:bg-accent transition-colors duration-200"></div>
            <div class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200 peer-checked:translate-x-4"></div>
          </div>
        </label>
      </div>
    </div>
  </div>
</div>
{{/* Settings gear — Mobile */}}
<div class="xl:hidden text-center">
  <button
    class="text-secondary hover:text-accent cursor-pointer transition-colors duration-200"
    type="button"
    onclick="let el = document.getElementById('settingsAccordion'); el.classList.toggle('hidden');"
    aria-label="{{ i18n "settings" }}"
  >
    <i class="fa-solid fa-gear text-xl"></i>
    <span class="ml-1 text-sm">{{ i18n "settings" }}</span>
  </button>
  <div id="settingsAccordion" class="hidden mt-4 text-left max-w-xs mx-auto">
    <div class="bg-surface rounded-[10px] border border-gray-200 shadow-lg py-3">
      {{/* Dark Mode */}}
      <div class="px-4 py-3">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-semibold text-secondary-2 uppercase">{{ i18n "dark_mode" }}</span>
          <div class="relative">
            <input type="checkbox" id="darkToggleMobile" class="sr-only peer" onchange="toggleDarkMode(this.checked)">
            <div class="w-9 h-5 bg-gray-300 rounded-full peer-checked:bg-accent transition-colors duration-200"></div>
            <div class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200 peer-checked:translate-x-4"></div>
          </div>
        </label>
      </div>
    </div>
  </div>
</div>
