{{ define "main" }}
<section class="py-16">
  <div class="container mx-auto max-w-md px-4">
    <h1 class="text-secondary mb-6 text-center font-secondary text-3xl font-bold">{{ .Title }}</h1>
    {{ with .Content }}
      <div class="text-gray-dark mb-8 text-center">{{ . }}</div>
    {{ end }}

    {{/* Friendly reason text from query string ?reason=... */}}
    <p id="login-error" class="text-red-600 mb-4 text-center hidden"></p>

    <form name="login" action="/login/" method="POST" class="space-y-4 rounded-[10px] bg-surface p-8 shadow-sm">
      <div>
        <label for="email" class="text-secondary mb-1 block text-sm font-medium">{{ i18n "member_email" }}</label>
        <input id="email" type="email" name="email" required autocomplete="email"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
      </div>
      <div>
        <label for="password" class="text-secondary mb-1 block text-sm font-medium">{{ i18n "member_password" }}</label>
        <input id="password" type="password" name="password" required autocomplete="current-password"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
      </div>
      <button type="submit"
              class="bg-accent hover:bg-accent-2 w-full rounded-[10px] px-4 py-2 font-medium text-white transition-colors">
        {{ i18n "member_sign_in" }}
      </button>
      <div class="text-center text-sm">
        <a href="/request-reset/" class="text-secondary-2 hover:text-accent">{{ i18n "member_forgot_password" }}</a>
      </div>
    </form>
  </div>
</section>

<script>
  (function () {
    var reasons = {
      combo_fail: {{ i18n "member_login_reason_combo_fail" }},
      misc: {{ i18n "member_login_reason_misc" }},
      failed_crypt: {{ i18n "member_login_reason_failed_crypt" }},
      token_invalid: {{ i18n "member_login_reason_token_invalid" }},
      db_query: {{ i18n "member_login_reason_db_query" }}
    };
    var params = new URLSearchParams(window.location.search);
    var reason = params.get('reason');
    if (reason && reasons[reason]) {
      var el = document.getElementById('login-error');
      el.textContent = reasons[reason];
      el.classList.remove('hidden');
    }
  })();
</script>
{{ end }}
