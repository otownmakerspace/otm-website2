{{ define "main" }}
<section class="py-16">
  <div class="container mx-auto max-w-md px-4">
    <h1 class="text-secondary mb-6 text-center font-secondary text-3xl font-bold">{{ .Title }}</h1>
    {{ with .Content }}
      <div class="text-gray-dark mb-8 text-center">{{ . }}</div>
    {{ end }}

    {{/* Token comes in via URL query ?token=...; the form action preserves it. */}}
    <form id="reset-form" method="POST" class="space-y-4 rounded-[10px] bg-surface p-8 shadow-sm">
      <div>
        <label for="password" class="text-secondary mb-1 block text-sm font-medium">{{ i18n "member_new_password" }}</label>
        <input id="password" type="password" name="password" required minlength="8" maxlength="31"
               autocomplete="new-password"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
        <p class="mt-1 text-xs text-gray-dark">{{ i18n "member_password_length_hint" | safeHTML }}</p>
      </div>
      <button type="submit"
              class="bg-accent hover:bg-accent-2 w-full rounded-[10px] px-4 py-2 font-medium text-white transition-colors">
        {{ i18n "member_update_password" }}
      </button>
    </form>
  </div>
</section>

<script>
  (function () {
    var token = new URLSearchParams(window.location.search).get('token');
    var form = document.getElementById('reset-form');
    form.action = '/reset-password/?token=' + encodeURIComponent(token || '');
  })();
</script>
{{ end }}
