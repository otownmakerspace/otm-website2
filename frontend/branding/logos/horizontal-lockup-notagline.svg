<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Horizontal lockup — NO TAGLINE variant.
  Same gear + wordmark composition as horizontal-lockup.svg, with the
  "MAKE · TINKER · SHARE" tagline omitted. Use in compact contexts
  (navbar, email signature, app icon header) where the extra ascii noise
  is more crowding than helpful.

  Canvas, gear position, and wordmark position are unchanged from the
  parent lockup so swapping between with/without-tagline produces no
  visual reflow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400">
  <image href="/images/branding/logos/gear-mark-transparent.svg" x="148.29599" y="0" width="400" height="400"/>
  <image href="/images/branding/logos/wordmark-consolidated.svg" x="430" y="48" width="1140" height="304"/>
</svg>
