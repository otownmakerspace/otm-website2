<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Facebook cover photo (1640x624)
  Mobile crops to centre 640x360 — keep important content centred horizontally
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <linearGradient id="fbOverlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1A63" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#0D1A63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0D1A63" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <image xlink:href="../../assets/images/socials/13_table_saw_svend.jpg"
         x="0" y="0" width="1640" height="624" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1640" height="624" fill="url(#fbOverlay)"/>

  <!--
    Mobile-safe centre zone: x=500..1140 (640 wide).
    Layout: small cube top-left of safe zone + larger wordmark below it,
    then tagline + CTA. This keeps everything inside mobile crop AND avoids
    visual collision between the cube and the wordmark.
  -->

  <!-- Cube mark, scaled smaller, top-left of safe zone -->
  <g transform="translate(560, 200) scale(0.32)">
    <path d="M 0,-180 L 156,-90 L 0,0 L -156,-90 Z" fill="#F68048"/>
    <rect x="-44" y="-134" width="88" height="88" fill="#FFFFFF" rx="8" ry="8"/>
    <path d="M -156,-90 L -156,180 L 0,270 L 0,0 Z" fill="#1A2CA3"/>
    <path d="M -110,30 L -78,46 L -78,210 L -110,194 Z" fill="#F68048"/>
    <path d="M 0,0 L 0,270 L 156,180 L 156,-90 Z" fill="#FF5722"/>
    <g transform="matrix(1, -0.577, 0, 1, 0, 0)">
      <path d="M 18,55 L 42,55 L 78,165 L 114,55 L 138,55 L 138,225 L 114,225 L 114,130 L 90,200 L 66,200 L 42,130 L 42,225 L 18,225 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Brand name beside cube -->
  <text x="640" y="190" font-family="Inter, sans-serif" font-weight="700"
        font-size="30" fill="#FFFFFF" letter-spacing="2">O'TOWN MAKERSPACE</text>
  <text x="640" y="225" font-family="Inter, sans-serif" font-weight="500"
        font-size="22" fill="#F68048" letter-spacing="3">ODENSE · DENMARK</text>

  <!-- Big headline, centred in safe zone -->
  <text x="820" y="370" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="76" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="-2">Make stuff. Make friends.</text>

  <!-- Tagline -->
  <text x="820" y="430" font-family="Inter, sans-serif" font-weight="500"
        font-size="26" fill="#EDF2F8" text-anchor="middle">3D · Laser · CNC · Wood · Metal · Electronics  ·  24/7 member access</text>

  <!-- CTA pill, centred in safe zone -->
  <rect x="650" y="470" width="340" height="74" rx="37" fill="#F68048"/>
  <text x="820" y="518" font-family="Inter, sans-serif" font-weight="700"
        font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BOOK A FREE TOUR</text>
</svg>
