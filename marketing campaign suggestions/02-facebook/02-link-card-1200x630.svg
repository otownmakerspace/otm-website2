<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Facebook / Open Graph link share card (1200x630, 1.91:1)
  Replaces or supplements static/images/og-default.jpg.
  Same dimensions also work for: LinkedIn link share, Twitter summary_large_image.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogOverlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1A63" stop-opacity="0.92"/>
      <stop offset="0.65" stop-color="#0D1A63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0D1A63" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <image xlink:href="../../assets/images/workspace/main_area/DSC02750.jpg"
         x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#ogOverlay)"/>

  <!-- Brand mark + name top-left -->
  <g transform="translate(80, 80)">
    <!-- Gear mark (gear-mark-white.svg colorway, knockout on photo) -->
    <g transform="translate(0, 10) scale(0.14)">
      <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
        <polygon points="-32,-345 32,-345 40,-290 -40,-290"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(30)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(60)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(90)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(120)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(150)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(180)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(210)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(240)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(270)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(300)"/>
        <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(330)"/>
      </g>
      <circle r="290" fill="#FFFFFF"/>
      <circle r="220" fill="#0D1A63"/>
      <circle r="220" fill="none" stroke="#FFFFFF" stroke-width="12"/>
      <text x="0" y="-10" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="270"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
            text-anchor="middle" letter-spacing="-4">T</text>
      <text x="0" y="185" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="230"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
            text-anchor="middle" letter-spacing="-4">M</text>
    </g>
    <text x="78" y="30" font-family="Inter, sans-serif" font-weight="700" font-size="26"
          fill="#FFFFFF">O'Town Makerspace</text>
  </g>

  <!-- Headline -->
  <text x="80" y="340" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="76" fill="#FFFFFF" letter-spacing="-2">Make what you</text>
  <text x="80" y="420" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="76" fill="#F68048" letter-spacing="-2">imagine.</text>

  <!-- Subline -->
  <text x="80" y="490" font-family="Inter, sans-serif" font-weight="500"
        font-size="28" fill="#EDF2F8">A community workshop in central Odense.</text>
  <text x="80" y="528" font-family="Inter, sans-serif" font-weight="500"
        font-size="28" fill="#EDF2F8">Tools, training, and 24/7 access for members.</text>

  <!-- Domain pill -->
  <rect x="80" y="560" width="320" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.15"
        stroke="#F68048" stroke-width="2"/>
  <text x="240" y="591" font-family="Inter, sans-serif" font-weight="700" font-size="22"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="2">makerspace.olaru.dk</text>
</svg>
