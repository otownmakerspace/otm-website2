<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Google Ads — medium rectangle banner (300x250) — most common display size
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <rect x="0" y="0" width="300" height="250" fill="#0D1A63"/>

  <!-- Decorative orange wedge top-right -->
  <path d="M 300,0 L 300,80 L 220,0 Z" fill="#F68048"/>

  <!-- Cube mark -->
  <g transform="translate(56, 70) scale(0.18)">
    <path d="M 0,-180 L 156,-90 L 0,0 L -156,-90 Z" fill="#F68048"/>
    <rect x="-44" y="-134" width="88" height="88" fill="#FFFFFF" rx="8" ry="8"/>
    <path d="M -156,-90 L -156,180 L 0,270 L 0,0 Z" fill="#1A2CA3"/>
    <path d="M -110,30 L -78,46 L -78,210 L -110,194 Z" fill="#F68048"/>
    <path d="M 0,0 L 0,270 L 156,180 L 156,-90 Z" fill="#FF5722"/>
    <g transform="matrix(1, -0.577, 0, 1, 0, 0)">
      <path d="M 18,55 L 42,55 L 78,165 L 114,55 L 138,55 L 138,225 L 114,225 L 114,130 L 90,200 L 66,200 L 42,130 L 42,225 L 18,225 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <text x="20" y="135" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="-1">Got an idea?</text>
  <text x="20" y="162" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="24" fill="#F68048" letter-spacing="-1">We have the tools.</text>

  <text x="20" y="190" font-family="Inter, sans-serif" font-weight="500"
        font-size="11" fill="#EDF2F8">3D · Laser · CNC · Wood · Electronics</text>

  <rect x="20" y="205" width="260" height="32" rx="16" fill="#F68048"/>
  <text x="150" y="226" font-family="Inter, sans-serif" font-weight="700"
        font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BOOK A FREE TOUR</text>
</svg>
