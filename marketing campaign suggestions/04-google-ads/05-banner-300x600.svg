<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Google Ads — half-page banner (300x600)
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <linearGradient id="hpOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1A63" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#0D1A63" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0D1A63" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="300" height="600" fill="#0D1A63"/>

  <!-- Photo upper half -->
  <image xlink:href="../../assets/images/socials/16_ida_laser.jpg"
         x="0" y="0" width="300" height="350" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="300" height="350" fill="url(#hpOverlay)"/>

  <!-- Gear mark (gear-mark-white.svg colorway, knockout on photo) -->
  <g transform="translate(150, 88) scale(0.11)">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="-32,-345 32,-345 40,-290 -40,-290"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(30)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(60)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(90)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(120)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(150)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(180)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(210)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(240)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(270)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(300)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(330)"/>
    </g>
    <circle r="290" fill="#FFFFFF"/>
    <circle r="220" fill="#0D1A63"/>
    <circle r="220" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <text x="0" y="-10" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="270"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
          text-anchor="middle" letter-spacing="-4">T</text>
    <text x="0" y="185" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="230"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
          text-anchor="middle" letter-spacing="-4">M</text>
  </g>

  <text x="150" y="170" font-family="Inter, sans-serif" font-weight="700"
        font-size="14" fill="#F68048" text-anchor="middle" letter-spacing="3">O'TOWN MAKERSPACE</text>

  <!-- Headline -->
  <text x="150" y="400" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">Make</text>
  <text x="150" y="440" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="34" fill="#F68048" text-anchor="middle" letter-spacing="-1">things.</text>
  <text x="150" y="480" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">In Odense.</text>

  <text x="150" y="520" font-family="Inter, sans-serif" font-weight="500"
        font-size="13" fill="#EDF2F8" text-anchor="middle">3D · Laser · CNC · Wood · Electronics</text>

  <rect x="40" y="540" width="220" height="40" rx="20" fill="#F68048"/>
  <text x="150" y="566" font-family="Inter, sans-serif" font-weight="700"
        font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BOOK A FREE TOUR</text>
</svg>
