<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Google Business post / update image (1200x900, 4:3)
  Use case: weekly update, new equipment announcement, special offer
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 900" width="1200" height="900">
  <rect x="0" y="0" width="1200" height="900" fill="#EDF2F8"/>

  <!-- Photo strip top half -->
  <image xlink:href="../../assets/images/workspace/lasercutter/DSC02740.jpg"
         x="0" y="0" width="1200" height="500" preserveAspectRatio="xMidYMid slice"/>

  <!-- Orange accent stripe -->
  <rect x="0" y="500" width="1200" height="12" fill="#F68048"/>

  <!-- Tag -->
  <rect x="60" y="560" width="220" height="48" rx="24" fill="#0D1A63"/>
  <text x="170" y="593" font-family="Inter, sans-serif" font-weight="700"
        font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">NEW THIS WEEK</text>

  <!-- Headline -->
  <text x="60" y="700" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="74" fill="#0D1A63" letter-spacing="-2">Laser cutter</text>
  <text x="60" y="780" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="74" fill="#F68048" letter-spacing="-2">induction night</text>

  <!-- Subline -->
  <text x="60" y="840" font-family="Inter, sans-serif" font-weight="500"
        font-size="28" fill="#1A2CA3">Thursday 18:00 · Free for members · DM to book a slot</text>

  <!-- Small cube mark, bottom-right -->
  <g transform="translate(1100, 830) scale(0.30)">
    <path d="M 0,-180 L 156,-90 L 0,0 L -156,-90 Z" fill="#F68048"/>
    <rect x="-44" y="-134" width="88" height="88" fill="#0D1A63" rx="8" ry="8"/>
    <path d="M -156,-90 L -156,180 L 0,270 L 0,0 Z" fill="#0D1A63"/>
    <path d="M -110,30 L -78,46 L -78,210 L -110,194 Z" fill="#F68048"/>
    <path d="M 0,0 L 0,270 L 156,180 L 156,-90 Z" fill="#FF5722"/>
    <g transform="matrix(1, -0.577, 0, 1, 0, 0)">
      <path d="M 18,55 L 42,55 L 78,165 L 114,55 L 138,55 L 138,225 L 114,225 L 114,130 L 90,200 L 66,200 L 42,130 L 42,225 L 18,225 Z" fill="#0D1A63"/>
    </g>
  </g>
</svg>
