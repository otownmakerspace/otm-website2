<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Google Business Profile cover (1920x1080, 16:9)
  Shows up at the top of the business profile in Search & Maps. First impression.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="gbOverlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1A63" stop-opacity="0.90"/>
      <stop offset="0.5" stop-color="#0D1A63" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0D1A63" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <image xlink:href="../../assets/images/workspace/main_area/DSC02795.jpg"
         x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#gbOverlay)"/>

  <!--
    Brand block on the left. Gear mark (gear-mark-white.svg colorway, knockout
    on photo) sized to anchor the headline beside it.
  -->
  <g transform="translate(150, 409) scale(0.42)">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="-32,-345 32,-345 40,-290 -40,-290"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(30)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(60)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(90)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(120)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(150)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(180)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(210)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(240)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(270)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(300)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(330)"/>
    </g>
    <circle r="290" fill="#FFFFFF"/>
    <circle r="220" fill="#0D1A63"/>
    <circle r="220" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <text x="0" y="-10" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="270"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
          text-anchor="middle" letter-spacing="-4">T</text>
    <text x="0" y="185" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="230"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
          text-anchor="middle" letter-spacing="-4">M</text>
  </g>

  <text x="300" y="510" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="100" fill="#FFFFFF" letter-spacing="-3">O'Town Makerspace</text>
  <text x="300" y="610" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="100" fill="#F68048" letter-spacing="-3">Odense</text>

  <text x="300" y="690" font-family="Inter, sans-serif" font-weight="500"
        font-size="36" fill="#EDF2F8">Community-driven workshop · Open weekly · Members 24/7</text>
  <text x="300" y="740" font-family="Inter, sans-serif" font-weight="500"
        font-size="36" fill="#EDF2F8">3D printing · laser cutting · CNC · woodworking · electronics</text>

  <rect x="300" y="810" width="380" height="80" rx="40" fill="#F68048"/>
  <text x="490" y="862" font-family="Inter, sans-serif" font-weight="700"
        font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BOOK A FREE TOUR</text>
</svg>
