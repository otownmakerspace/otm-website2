<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Google Business Profile cover (1920x1080, 16:9)
  Shows up at the top of the business profile in Search & Maps. First impression.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="gbOverlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1A63" stop-opacity="0.90"/>
      <stop offset="0.5" stop-color="#0D1A63" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0D1A63" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <image xlink:href="../../assets/images/workspace/main_area/DSC02795.jpg"
         x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#gbOverlay)"/>

  <!--
    Brand block on the left. Cube scaled 0.65 (was 0.80 — caused overlap with
    wordmark). Wordmark moved further right for breathing room.
  -->
  <g transform="translate(150, 380) scale(0.65)">
    <path d="M 0,-180 L 156,-90 L 0,0 L -156,-90 Z" fill="#F68048"/>
    <rect x="-44" y="-134" width="88" height="88" fill="#FFFFFF" rx="8" ry="8"/>
    <path d="M -156,-90 L -156,180 L 0,270 L 0,0 Z" fill="#1A2CA3"/>
    <path d="M -110,30 L -78,46 L -78,210 L -110,194 Z" fill="#F68048"/>
    <path d="M 0,0 L 0,270 L 156,180 L 156,-90 Z" fill="#FF5722"/>
    <g transform="matrix(1, -0.577, 0, 1, 0, 0)">
      <path d="M 18,55 L 42,55 L 78,165 L 114,55 L 138,55 L 138,225 L 114,225 L 114,130 L 90,200 L 66,200 L 42,130 L 42,225 L 18,225 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <text x="300" y="510" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="100" fill="#FFFFFF" letter-spacing="-3">O'Town Makerspace</text>
  <text x="300" y="610" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="100" fill="#F68048" letter-spacing="-3">Odense</text>

  <text x="300" y="690" font-family="Inter, sans-serif" font-weight="500"
        font-size="36" fill="#EDF2F8">Community-driven workshop · Open weekly · Members 24/7</text>
  <text x="300" y="740" font-family="Inter, sans-serif" font-weight="500"
        font-size="36" fill="#EDF2F8">3D printing · laser cutting · CNC · woodworking · electronics</text>

  <rect x="300" y="810" width="380" height="80" rx="40" fill="#F68048"/>
  <text x="490" y="862" font-family="Inter, sans-serif" font-weight="700"
        font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BOOK A FREE TOUR</text>
</svg>
