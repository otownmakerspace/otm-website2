<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Gear mark — BLUEPRINT variant.
  Same white-on-navy treatment as gear-mark-white.svg, but the navy
  background is replaced with a drafting-paper grid pattern:
    - Brand navy (#0D1A63) base — stays on-brand
    - Minor grid every 16 units (subtle, opacity 0.08)
    - Major grid every 80 units (more visible, opacity 0.20)
    - All grid lines white, so the pattern works against any white logo
      element on top
  Use for: hero graphics, "we make things" creative posts, technical-feel
  marketing, plan-style mockups.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!--
      Blueprint grid pattern.
      Tile size 80 × 80.
      Inside the tile:
        • The base fill paints brand navy.
        • Minor grid: 4 horizontal + 4 vertical lines at 16-unit intervals,
          opacity 0.08 (whisper of grid).
        • Major grid: 1 horizontal + 1 vertical line on the tile edge,
          opacity 0.20 (firm cell boundary).
      patternUnits="userSpaceOnUse" so the grid aligns to canvas coords,
      not to the shape we apply it to (avoids weird alignment when the
      pattern is used as a fill on transformed objects).
    -->
    <pattern id="blueprintGrid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#0D1A63"/>
      <!-- Minor grid (every 16 units) — bolder for visibility -->
      <g stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25">
        <line x1="0" y1="16" x2="80" y2="16"/>
        <line x1="0" y1="32" x2="80" y2="32"/>
        <line x1="0" y1="48" x2="80" y2="48"/>
        <line x1="0" y1="64" x2="80" y2="64"/>
        <line x1="16" y1="0" x2="16" y2="80"/>
        <line x1="32" y1="0" x2="32" y2="80"/>
        <line x1="48" y1="0" x2="48" y2="80"/>
        <line x1="64" y1="0" x2="64" y2="80"/>
      </g>
      <!-- Major grid lines on tile edges (every 80 units when tiled) — bolder -->
      <g stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.50">
        <line x1="0" y1="0" x2="80" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="80"/>
      </g>
    </pattern>
  </defs>

  <!-- Blueprint background -->
  <rect width="800" height="800" rx="120" ry="120" fill="url(#blueprintGrid)"/>

  <g transform="translate(400, 400)">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14"
       stroke-linejoin="round" stroke-linecap="round">
      <polygon points="-32,-345 32,-345 40,-290 -40,-290"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(30)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(60)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(90)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(120)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(150)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(180)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(210)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(240)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(270)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(300)"/>
      <polygon points="-32,-345 32,-345 40,-290 -40,-290" transform="rotate(330)"/>
    </g>
    <circle r="290" fill="#FFFFFF"/>
    <!--
      Inner cream face — re-uses the blueprint pattern so the gear's
      "hub area" looks like a window cut into the blueprint paper. This
      is the small detail that elevates the variant from "logo on a
      patterned bg" to "logo etched onto blueprint paper".
    -->
    <circle r="220" fill="url(#blueprintGrid)"/>
    <circle r="220" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <text x="0" y="-10" font-family="Inter Display, Inter, sans-serif"
          font-weight="900" font-size="270"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14"
          stroke-linejoin="round" stroke-linecap="round"
          text-anchor="middle" letter-spacing="-4">T</text>
    <text x="0" y="185" font-family="Inter Display, Inter, sans-serif"
          font-weight="900" font-size="230"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14"
          stroke-linejoin="round" stroke-linecap="round"
          text-anchor="middle" letter-spacing="-4">M</text>
  </g>
</svg>
