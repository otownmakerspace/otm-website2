<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Horizontal lockup — gear (left) + wordmark (right) + tagline.
  Loads gear and wordmark via <image> references to the canonical
  static-folder logos, so any update to those propagates here.
  Canvas: 1600 × 400 (4:1) — matches Google Ads landscape logo spec.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <!-- Gear mark, left -->
  <image href="../../static/images/branding/logos/gear-mark-transparent.svg"
         x="40" y="20" width="360" height="360"/>

  <!--
    Wordmark, right. Wordmark SVG natural ratio is 1200×320 ≈ 3.75:1.
    Sized at width=1140, height=304 to keep the same ratio.
  -->
  <image href="../../static/images/branding/logos/wordmark-consolidated.svg"
         x="430" y="48" width="1140" height="304"/>

  <!-- Tagline -->
  <text x="1000" y="370" font-family="Inter, sans-serif" font-weight="500"
        font-size="20" fill="#0D1A63" text-anchor="middle" letter-spacing="4">MAKE · TINKER · SHARE  ·  ODENSE</text>
</svg>
