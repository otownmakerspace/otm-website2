<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Wordmark — BLUEPRINT variant. Same definition as the gear blueprint
  background; see gear-mark-blueprint.svg for full pattern docs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <pattern id="blueprintGrid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#0D1A63"/>
      <g stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25">
        <line x1="0" y1="16" x2="80" y2="16"/>
        <line x1="0" y1="32" x2="80" y2="32"/>
        <line x1="0" y1="48" x2="80" y2="48"/>
        <line x1="0" y1="64" x2="80" y2="64"/>
        <line x1="16" y1="0" x2="16" y2="80"/>
        <line x1="32" y1="0" x2="32" y2="80"/>
        <line x1="48" y1="0" x2="48" y2="80"/>
        <line x1="64" y1="0" x2="64" y2="80"/>
      </g>
      <g stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.50">
        <line x1="0" y1="0" x2="80" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="80"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#blueprintGrid)"/>

  <text x="600" y="155" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="200"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"
        text-anchor="middle" letter-spacing="8">O'TOWN</text>
  <text x="600" y="290" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="130"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"
        text-anchor="middle" letter-spacing="4">MAKERSPACE</text>
</svg>
