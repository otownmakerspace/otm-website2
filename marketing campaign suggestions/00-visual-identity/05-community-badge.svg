<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Community badge — circular emblem reinforcing the safe/community pillar.
  Use for: stickers, t-shirts, induction certificates, "member since" badges.
  Centre uses the canonical gear-mark via <image> reference.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <path id="topArc" d="M 100,400 A 300,300 0 0 1 700,400" fill="none"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="400" cy="400" r="380" fill="#0D1A63"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="#EDF2F8" stroke-width="3"/>
  <circle cx="400" cy="400" r="300" fill="#1A2CA3"/>
  <circle cx="400" cy="400" r="290" fill="none" stroke="#F68048" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Curved text top -->
  <text font-family="Inter, sans-serif" font-weight="700" font-size="38" fill="#EDF2F8"
        letter-spacing="8" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">O'TOWN MAKERSPACE</textPath>
  </text>

  <!-- Centre gear-mark -->
  <image href="../../static/images/branding/logos/gear-mark-transparent.svg"
         x="265" y="265" width="270" height="270"/>

  <!-- Bottom flat text -->
  <text x="400" y="640" font-family="Inter, sans-serif" font-weight="600"
        font-size="30" fill="#F68048" letter-spacing="14" text-anchor="middle">★ ODENSE · DENMARK ★</text>

  <!-- Side dots at 9 and 3 o'clock -->
  <circle cx="80" cy="400" r="6" fill="#F68048"/>
  <circle cx="720" cy="400" r="6" fill="#F68048"/>
</svg>
