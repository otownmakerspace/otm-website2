<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Vertical lockup — gear above, wordmark below, tagline at bottom.
  Loads gear and wordmark via <image> references to the canonical
  static-folder logos.
  Canvas: 800 × 1000 (4:5) — matches Instagram portrait spec.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- Gear mark, top -->
  <image href="../../static/images/branding/logos/gear-mark-transparent.svg"
         x="100" y="40" width="600" height="600"/>

  <!--
    Wordmark, bottom. Sized at width=720, height=192 (preserves 3.75:1).
  -->
  <image href="../../static/images/branding/logos/wordmark-consolidated.svg"
         x="40" y="680" width="720" height="192"/>

  <!-- Tagline -->
  <text x="400" y="950" font-family="Inter, sans-serif" font-weight="500"
        font-size="22" fill="#0D1A63" text-anchor="middle" letter-spacing="6">ODENSE · DENMARK</text>
</svg>
