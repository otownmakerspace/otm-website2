<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Wordmark — WHITE on transparent background.
  Companion to wordmark-white.svg (which has a navy fill rect baked in).
  Use this when the surface beneath the logo isn't the brand navy —
  e.g. dark-mode page chrome, photo overlays in editorial layouts,
  social posts where you don't want a hard-edge navy box around the type.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <text x="600" y="155" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="200"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"
        text-anchor="middle" letter-spacing="8">O'TOWN</text>
  <text x="600" y="290" font-family="Inter Display, Inter, sans-serif" font-weight="900" font-size="130"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"
        text-anchor="middle" letter-spacing="4">MAKERSPACE</text>
</svg>
