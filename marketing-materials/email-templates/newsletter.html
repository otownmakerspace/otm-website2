<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O'Town Makerspace — Newsletter template</title>
  <!--
    Member newsletter for hand-sending from Gmail.
    Open in a browser → select all → copy → paste into Gmail compose →
    replace [BRACKETED] text (delete the button table if unused) →
    BCC "Makerspace Members" and send.
    Tables + inline styles only — <style> blocks don't survive the paste.
    Palette mirrors frontend/config/_default/hugo.toml [params.colors].
  -->
</head>
<body style="margin: 0; padding: 0; background-color: #EDF2F8; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: #1A2CA3;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; background-color: #EDF2F8;">
    <tr>
      <td align="center" style="padding: 32px 16px;">

        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; max-width: 560px;">

          <!-- Wordmark -->
          <tr>
            <td align="center" style="padding-bottom: 20px;">
              <a href="https://otownmakerspace.dk" style="text-decoration: none;">
                <span style="font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; color: #0D1A63; letter-spacing: 1px;">
                  O'TOWN&nbsp;<span style="color: #F68048;">MAKERSPACE</span>
                </span>
              </a>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color: #ffffff; border: 1px solid #E1E9F4; border-radius: 12px; padding: 32px;">

              <h1 style="margin: 0 0 16px 0; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; line-height: 30px; font-weight: 700; color: #0D1A63;">
                [HEADLINE]
              </h1>

              <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #1A2CA3;">
                Hi everyone,
              </p>
              <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #1A2CA3;">
                [YOUR MESSAGE — keep links orange:
                <a href="https://otownmakerspace.dk" style="color: #F68048; text-decoration: underline;">like this</a>.]
              </p>

              <!-- Optional button — delete this table if not needed -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; margin: 24px 0;">
                <tr>
                  <td align="center" bgcolor="#F68048" style="border-radius: 10px;">
                    <a href="https://otownmakerspace.dk" style="display: inline-block; padding: 12px 28px; font-family: 'Roboto', sans-serif; font-size: 16px; font-weight: 600; line-height: 20px; color: #ffffff; text-decoration: none; background-color: #F68048; border-radius: 10px;">
                      [BUTTON TEXT]
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin: 24px 0 0 0; font-size: 16px; line-height: 24px; color: #1A2CA3;">
                See you at the space,<br>
                <strong style="color: #0D1A63;">The O'Town Makerspace team</strong>
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
