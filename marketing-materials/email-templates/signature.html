<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>O'Town Makerspace — Gmail signature</title>
<!--
  Gmail signature for all hand-sent mail (info@ and personal Workspace accounts).

  Usage: open this file in a browser, select all (Ctrl+A), copy (Ctrl+C),
  then paste with PLAIN Ctrl+V (not Ctrl+Shift+V) into Gmail → Settings →
  See all settings → General → Signature. Assign it to the
  info@otownmakerspace.dk send-as identity too, so both identities carry it.

  Design rules, learned the hard way against Gmail's signature sanitizer:
    - No tables, no cell/element borders, no backgrounds — all stripped on
      save. Only p/span/a with inline color/font styles survive reliably.
    - The orange brand accent is a CONTINUOUS horizontal rule made of
      repeated ━ glyphs (U+2501): unlike vertical glyph stacks, characters
      on one line sit flush, so the rule has no gaps — and it's literal
      text, so the sanitizer can't remove it.
    - Text wordmark: SVG logos don't render in Gmail.
    - Palette from frontend/config/_default/hugo.toml [params.colors] and
      BRAND_GUIDELINES.md: navy #0D1A63, orange #F68048, muted #7681AB.
-->
</head>
<body style="margin:0; padding:24px; background:#ffffff;">

<div style="font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;">

  <!-- Wordmark -->
  <p style="margin:0; font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:16px; font-weight:700; letter-spacing:1px; line-height:22px;">
    <span style="color:#0D1A63;">O'TOWN</span>&nbsp;<span style="color:#F68048;">MAKERSPACE</span>
  </p>

  <!-- Orange rule: continuous within a line, echoes the navy-over-orange lockup -->
  <p style="margin:1px 0 3px 0; font-size:10px; line-height:10px; color:#F68048;">&#9473;&#9473;&#9473;&#9473;&#9473;&#9473;&#9473;&#9473;&#9473;&#9473;&#9473;&#9473;</p>

  <!-- Tagline -->
  <p style="margin:0 0 10px 0; font-size:11px; letter-spacing:1.5px; line-height:16px; color:#7681AB;">
    MAKE&nbsp;&middot;&nbsp;TINKER&nbsp;&middot;&nbsp;SHARE&nbsp;&middot;&nbsp;ODENSE
  </p>

  <!-- Contact -->
  <p style="margin:0 0 2px 0; font-size:13px; line-height:20px; color:#7681AB;">
    <a href="https://otownmakerspace.dk" style="color:#0D1A63; text-decoration:underline;">otownmakerspace.dk</a>
    &nbsp;&middot;&nbsp;
    <a href="mailto:info@otownmakerspace.dk" style="color:#0D1A63; text-decoration:underline;">info@otownmakerspace.dk</a>
  </p>

  <!-- Address -->
  <p style="margin:0 0 6px 0; font-size:13px; line-height:20px; color:#7681AB;">
    Havnegade 57, 5000 Odense C, Denmark
  </p>

  <!-- Social -->
  <p style="margin:0; font-size:13px; line-height:20px;">
    <a href="https://www.instagram.com/otown_makerspace/" style="color:#F68048; text-decoration:none;">Instagram</a>
    <span style="color:#7681AB;">&nbsp;&middot;&nbsp;</span>
    <a href="https://www.facebook.com/profile.php?id=61590717692379" style="color:#F68048; text-decoration:none;">Facebook</a>
    <span style="color:#7681AB;">&nbsp;&middot;&nbsp;</span>
    <a href="https://discord.gg/RHVfMu49CG" style="color:#F68048; text-decoration:none;">Discord</a>
  </p>

</div>

</body>
</html>
