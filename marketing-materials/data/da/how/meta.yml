tag: Løsningen
headline: Ét medlemskab. Alt værktøj. Når som helst.
subtitle: Bliv medlem af O'Town Makerspace og træd ind i et fuldt udstyret værksted, når inspirationen rammer — dag, nat og weekend.
steps:
- icon: key
  title: Døgnadgang med nøgle
  body: Medlemmer kommer og går på egen tid. Værkstedet lukker aldrig.
- icon: build
  title: Proværktøj, delt udgift
  body: Maskiner til tusindvis af kroner — dine at bruge for prisen af et månedligt medlemskab.
- icon: groups
  title: Et fællesskab af skabere
  body: Workshops, hjælp og mennesker, der elsker at bygge lige så meget som dig.
