<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  {{- /*
    Newsletter chrome: the streamlined variant of the transactional
    _layout.html (no footer, 560px, no preheader). The <style> block below
    only targets markdown-rendered tags inside .content — premailer inlines
    it onto each element at build time, so the emitted file survives the
    copy-paste into Gmail. Palette mirrors
    frontend/config/_default/hugo.toml [params.colors].
  */ -}}
  <style>
    .content h1 { margin: 0 0 16px 0; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; line-height: 30px; font-weight: 700; color: #0D1A63; }
    .content h2 { margin: 28px 0 12px 0; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; color: #0D1A63; }
    .content h3 { margin: 24px 0 8px 0; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; line-height: 24px; font-weight: 700; color: #0D1A63; }
    .content p { margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #1A2CA3; }
    .content ol, .content ul { margin: 0 0 16px 0; padding-left: 24px; font-size: 16px; line-height: 24px; color: #1A2CA3; }
    .content li { margin-bottom: 8px; }
    .content a { color: #F68048; text-decoration: underline; }
    .content strong { color: #0D1A63; }
    .content hr { border: none; border-top: 1px solid #E1E9F4; margin: 28px 0; }
    .content blockquote { margin: 0 0 16px 0; padding: 4px 16px; border-left: 3px solid #F68048; }
    .content img { max-width: 100%; height: auto; border: 0; border-radius: 8px; }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #EDF2F8; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: #1A2CA3;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; background-color: #EDF2F8;">
    <tr>
      <td align="center" style="padding: 32px 16px;">

        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; max-width: 560px;">

          <tr>
            <td align="center" style="padding-bottom: 20px;">
              <a href="https://otownmakerspace.dk" style="text-decoration: none;">
                <span style="font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; color: #0D1A63; letter-spacing: 1px;">
                  O'TOWN&nbsp;<span style="color: #F68048;">MAKERSPACE</span>
                </span>
              </a>
            </td>
          </tr>

          <tr>
            <td class="content" style="background-color: #ffffff; border: 1px solid #E1E9F4; border-radius: 12px; padding: 32px;">
{{.Content}}
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
