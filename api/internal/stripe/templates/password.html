<div class="space-y-4" id="password-card">
  <div class="flex items-center justify-between">
    <h2 class="text-secondary font-secondary text-xl font-bold">{{ .S.ChangePassword }}</h2>
    {{ if .SavedFlag }}
      <span class="inline-flex items-center rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700">
        {{ .S.Updated }}
      </span>
    {{ end }}
  </div>

  {{ with .Error }}
    <p class="rounded-[8px] bg-red-50 px-4 py-3 text-sm text-red-700">{{ . }}</p>
  {{ end }}

  {{ if .SavedFlag }}
    <p class="text-sm text-gray-dark">
      {{ .S.PasswordUpdatedMsg }}
    </p>
    <button
      hx-get="/profile/password"
      hx-target="#password-card"
      hx-swap="outerHTML"
      class="rounded-[10px] border border-gray-300 px-4 py-2 text-sm text-secondary hover:border-accent hover:text-accent transition-colors">
      {{ .S.ChangeAgain }}
    </button>
  {{ else }}
    <form
      hx-post="/profile/password"
      hx-target="#password-card"
      hx-swap="outerHTML"
      class="space-y-4"
    >
      <div>
        <label for="pw-current" class="text-secondary mb-1 block text-sm font-medium">{{ .S.CurrentPassword }}</label>
        <input id="pw-current" type="password" name="current" required autocomplete="current-password"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
      </div>
      <div>
        <label for="pw-next" class="text-secondary mb-1 block text-sm font-medium">{{ .S.NewPassword }}</label>
        <input id="pw-next" type="password" name="next" required minlength="{{ .MinLen }}" maxlength="{{ .MaxLen }}" autocomplete="new-password"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
        <p class="mt-1 text-xs text-gray-dark">{{ .S.PasswordHint }}</p>
      </div>
      <div>
        <label for="pw-confirm" class="text-secondary mb-1 block text-sm font-medium">{{ .S.ConfirmNewPassword }}</label>
        <input id="pw-confirm" type="password" name="confirm" required minlength="{{ .MinLen }}" maxlength="{{ .MaxLen }}" autocomplete="new-password"
               class="w-full rounded-[8px] border border-gray-300 bg-white px-3 py-2 text-secondary focus:border-accent focus:outline-none">
      </div>
      <button type="submit"
              class="rounded-[10px] bg-accent px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-accent-2">
        {{ .S.UpdatePassword }}
      </button>
    </form>
  {{ end }}
</div>
