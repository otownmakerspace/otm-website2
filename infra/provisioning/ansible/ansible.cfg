[defaults]
# Disable host key checking for initial provisioning (cloud-init hasn't finished yet)
host_key_checking = False
# Speed up Ansible by reusing SSH connections and reducing module overhead
pipelining = True
# Suppress Python interpreter discovery warnings
interpreter_python = auto_silent
# Shorter timeout for initial connection attempts
timeout = 30
# Vault password — gitignored, resolved relative to the working directory
# at run time (setup.sh cd's into this directory before invoking ansible).
vault_password_file = .vault_pass

[ssh_connection]
# Reuse SSH connections for speed
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
