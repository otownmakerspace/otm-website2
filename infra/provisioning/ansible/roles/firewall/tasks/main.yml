---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Reset UFW to defaults
  community.general.ufw:
    state: reset

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

# NOTE: SSH is intentionally NOT allowed on all interfaces.
# It is restricted to tailscale0 via ufw_tailscale_ports.
# The Tailscale role runs before this role, so the tunnel is
# already up when these rules take effect.

- name: Allow public ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Allow Tailscale-only ports
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_tailscale_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable UFW logging
  community.general.ufw:
    logging: "on"

