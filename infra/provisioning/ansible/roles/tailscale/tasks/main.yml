---
- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read current Tailscale status (used to detect already-joined nodes)
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join Tailscale network
  ansible.builtin.command:
    cmd: >
      tailscale up
      --authkey {{ tailscale_auth_key }}
      --hostname {{ server_hostname }}
      --operator {{ user_name }}
  # Run unconditionally — `tailscale up` is idempotent: if the node is
  # already authenticated with the same flags, it's a no-op. The earlier
  # gating on "Logged out." in stdout silently skipped fresh installs that
  # report "NoState" or empty JSON, leaving the server off the tailnet.
  changed_when: "'BackendState\":\"Running\"' not in tailscale_status.stdout"

