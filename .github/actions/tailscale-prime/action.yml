name: "Tailscale Connect & Prime SSH"
description: "Connect runner to Tailnet, load SSH key, accept host key (first connect), and expose 100.x IP"

inputs:
  tailscale_oauth_client_id:
    description: "Tailscale OAuth client ID"
    required: true
  tailscale_oauth_client_secret:
    description: "Tailscale OAuth client secret"
    required: true
  ssh_private_key:
    description: "SSH private key to use for subsequent SSH/rsync commands"
    required: true
  remote_username:
    description: "SSH username on remote host"
    required: true
  remote_host:
    description: "Remote host (Tailscale IP or MagicDNS name)"
    required: true
  tags:
    description: "Tailscale node tags for the runner"
    required: false
    default: "tag:ci"
  tailscale_args:
    description: "Extra args to pass to tailscale up"
    required: false
    default: "--accept-dns=true --accept-routes=true"

outputs:
  resolved_host:
    description: "Resolved Tailscale IPv4 (100.x.y.z) for the host, if resolvable; otherwise echoes remote_host"
    value: ${{ steps.resolve.outputs.resolved_host }}

runs:
  using: "composite"
  steps:
    - name: Connect runner to Tailscale
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ inputs.tailscale_oauth_client_id }}
        oauth-secret: ${{ inputs.tailscale_oauth_client_secret }}
        tags: ${{ inputs.tags }}
        args: ${{ inputs.tailscale_args }}

    - name: Check Tailscale connectivity
      shell: bash
      run: |
        set -euo pipefail
        tailscale status

    - name: Resolve Tailscale IPv4 (best effort)
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        HOST="${{ inputs.remote_host }}"
        if [[ "$HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
          echo "resolved_host=$HOST" >> "$GITHUB_OUTPUT"
        else
          if IP=$(tailscale ip -4 "$HOST" 2>/dev/null | head -n1); then
            if [[ -n "$IP" ]]; then
              echo "resolved_host=$IP" >> "$GITHUB_OUTPUT"
            else
              echo "resolved_host=$HOST" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "resolved_host=$HOST" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Setup SSH agent (load private key)
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh_private_key }}

    - name: Prime known_hosts (accept on first connect)
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${{ steps.resolve.outputs.resolved_host }}"
        # SECURITY: accept-new trusts the host key on first connection (TOFU).
        # Acceptable because the connection goes through Tailscale's authenticated WireGuard tunnel.
        ssh -o StrictHostKeyChecking=accept-new "${{ inputs.remote_username }}@${TARGET}" true
