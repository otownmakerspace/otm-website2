name: "Deploy Production App"

on:
  push:
    branches:
      - production

env:
  GHCR_IMAGE_TAG: ghcr.io/${{ github.repository }}/${{ vars.IMAGE }}

jobs:
  test:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run tests
        uses: ./.github/actions/test

  # The Docker image build (infra/app/Dockerfile, frontend-builder stage) runs
  # npm install -> Tailwind -> Hugo internally, so it is the single source of
  # truth for the compiled static site. No separate Hugo/artifact step is needed
  # here; a prior build-hugo job only produced a CSS-less public/ that the Docker
  # build overwrote anyway — the builder does `COPY frontend/ ./` and re-runs
  # Hugo, and only the in-Docker run executes Tailwind first. Staging dropped
  # the same job for the same reason (see deploy-staging-app.yml).
  publish:
    runs-on: ubuntu-latest
    environment: Production
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Publish Docker Image
        uses: ./.github/actions/publish
        with:
          ghcr_token: ${{ secrets.GHCR_TOKEN }}
          ghcr_image_tag: ${{ env.GHCR_IMAGE_TAG }}
          hugo_environment: production
          hugo_base_url: "https://${{ vars.SUBDOMAIN }}.${{ vars.TOPDOMAIN }}/"
          # Forwarded into the in-Docker Hugo build as HUGO_PARAMS_SUBDOMAIN /
          # HUGO_PARAMS_TOPDOMAIN, which _partials/func/members-href.html reads
          # to compose members.<sub>.<top> links. Staging passes these; without
          # them Hugo sees empty params and emits broken member-portal URLs.
          subdomain: ${{ vars.SUBDOMAIN }}
          topdomain: ${{ vars.TOPDOMAIN }}

  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: ./.github/actions/deploy-app
        with:
          deployment_remote_host: ${{ secrets.DEPLOYMENT_REMOTE_HOST }}
          deployment_remote_username: ${{ secrets.DEPLOYMENT_REMOTE_USERNAME }}
          deployment_remote_ssh_private_key: ${{ secrets.DEPLOYMENT_REMOTE_SSH_PRIVATE_KEY }}
          ghcr_token: ${{ secrets.GHCR_TOKEN }}
          ghcr_image_tag: ${{ env.GHCR_IMAGE_TAG }}
          image: ${{ vars.IMAGE }}
          subdomain: ${{ vars.SUBDOMAIN }}
          topdomain: ${{ vars.TOPDOMAIN }}
          stripe_price_id: ${{ vars.STRIPE_PRICE_ID }}
          session_cookie_name: ${{ vars.SESSION_COOKIE_NAME }}
          email_address: ${{ secrets.EMAIL_ADDRESS }}
          email_host: ${{ vars.EMAIL_HOST }}
          email_port: ${{ vars.EMAIL_PORT }}
          brand_name: ${{ vars.BRAND_NAME }}
          brand_wordmark_leading: ${{ vars.BRAND_WORDMARK_LEADING }}
          brand_wordmark_accent: ${{ vars.BRAND_WORDMARK_ACCENT }}
          brand_logo_url: ${{ vars.BRAND_LOGO_URL }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_client_secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          stripe_key: ${{ secrets.STRIPE_KEY }}
          stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          cookie_store_key: ${{ secrets.COOKIE_STORE_KEY }}
          email_password: ${{ secrets.EMAIL_PASSWORD }}
          altcha_hmac_key: ${{ secrets.ALTCHA_HMAC_KEY }}
