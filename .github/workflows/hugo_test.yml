name: Test build the Hugo static site

on:
  pull_request:
    branches:
      - master
      - main
      - staging
      - production

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Compile Tailwind first so static/css/styles.css exists before Hugo
      # publishes the static/ tree — matches infra/app/Dockerfile and the
      # test action. Without it this check passes on a styleless build.
      - name: Build CSS with Tailwind
        working-directory: frontend
        run: |
          npm install
          npx @tailwindcss/cli -i input.css -o static/css/styles.css --minify

      - name: Build with Hugo
        working-directory: frontend
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify
